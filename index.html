<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ほろっちの冬休み 2026</title>
    <link rel="icon" type="image/png" href="resources/icon.png">
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            border: 3px solid #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: #000;
            width: 1200px;
            height: 800px;
            position: relative;
            overflow: hidden;
        }
        
        .info {
            text-align: center;
            color: white;
            margin-bottom: 10px;
        }
        
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
        
        /* スマートフォン対応 */
        @media screen and (max-width: 768px) {
            body {
                background: #000;
                padding: 0;
                margin: 0;
            }
            
            #game-container {
                width: 100vw;
                height: 100vh;
                border: none;
                border-radius: 0;
                box-shadow: none;
                position: fixed;
                top: 0;
                left: 0;
                overflow: hidden;
            }
            
            .info {
                display: none;
            }
        }
        
        /* タブレット対応（オプション） */
        @media screen and (min-width: 769px) and (max-width: 1024px) {
            #game-container {
                width: 100vw;
                height: calc(100vw * 800 / 1200);
                max-height: 100vh;
                border: none;
                border-radius: 0;
                overflow: hidden;
            }
            
            body {
                background: #000;
            }
            
            .info {
                display: none;
            }
        }

        /* Electron: グラデーション枠をやめ、ゲーム領域（黒）だけをウィンドウ全面に */
        html.electron,
        html.electron body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        html.electron body {
            display: block;
            background: #000;
        }

        html.electron body > div {
            width: 100%;
            height: 100%;
            position: relative;
        }

        html.electron #game-container {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 0;
            box-shadow: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        html.electron .info {
            display: none;
        }
    </style>
    <script>
        if (typeof window.electronApp !== 'undefined') {
            document.documentElement.classList.add('electron');
        }
    </script>
</head>
<body>
    <div>
        <div class="info">
            <h1></h1>
            <p></p>
        </div>
        <div id="game-container"></div>
    </div>
    <!-- npm の phaser パッケージを同梱（オフライン可・CDN 不要） -->
    <script src="./node_modules/phaser/dist/phaser.min.js"></script>
    <script>
        // API GatewayのエンドポイントURLを設定
        // デプロイ後にCDKの出力から取得したURLを設定してください
        // 例: window.API_BASE_URL = 'https://xxxxxxxxxx.execute-api.ap-northeast-1.amazonaws.com/prod';
        // 開発環境では未設定のまま（デフォルトで http://localhost:3000 が使用されます）
        
        // 本番環境のAPI Gateway URLを設定
        // ローカル開発時はコメントアウトしてください（デフォルトで http://localhost:3000 が使用されます）
        // window.API_BASE_URL = '';
        
        // デバッグ用: 設定されたURLをコンソールに表示
        console.log('API_BASE_URL set to:', window.API_BASE_URL);
    </script>
    <script type="module" src="./game.js"></script>
    <script>
        // ゲームエリア内で右クリックメニューを無効化
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof window.electronApp !== 'undefined') {
                document.documentElement.classList.add('electron');
            }
            const gameContainer = document.getElementById('game-container');
            if (gameContainer) {
                gameContainer.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    return false;
                });
            }
        });
    </script>
</body>
</html>
